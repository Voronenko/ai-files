---
name: tests

"on":
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML (marketplace-update dependency)
        run: python3 -m pip install --quiet pyyaml

      - name: Install yq (skills tools dependency)
        run: |
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Shellcheck bin scripts
        run: shellcheck -S warning bin/ai-files-mcp bin/ai-files-setup bin/ai-files-config bin/ai-files-marketplace bin/ai-files-marketplace-install bin/ai-files-skills-add bin/ai-files-skills-explore bin/ai-files-skills-sync bin/ai-files-skill-enable bin/ai-files-skill-disable bin/ai-files-update

      - name: Run integration suites
        run: |
          fail=0
          for s in tests/run-tests.sh tests/test-*.sh; do
            echo "::group::==> $s"
            bash "$s" || fail=1
            echo "::endgroup::"
          done
          exit $fail
