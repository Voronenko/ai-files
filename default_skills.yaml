# alexknowshtml/teach link as teach-mattpocock and teach-alexknowshtml.
default_skills:
  # Core skills
  # - adr-tools
  # - graphify
  - humble-pr-review
  # - lnav
  # - lnav-unattended
  - mermaid
  - obsidian-cli
  - plantuml
  - pyenv-poetry-virtual-env
  # - zellij
  - playwright-cli
  - workout
  # Vendor skills (namespace/skill)
  - alexknowshtml/teach
  - mattpocock/teach
  # Note: a-template is excluded (it's a template, not meant for production use)
